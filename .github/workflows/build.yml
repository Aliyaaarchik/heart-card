name: Build APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build APK
      uses: docker://kivy/buildozer
      with:
        args: android debug

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
